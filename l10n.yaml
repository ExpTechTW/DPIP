# Configuration for Flutter's gen-l10n localization generator.
#
# ARB sources live in lib/l10n; generated Dart is written to lib/l10n/gen and
# imported as `package:dpip/l10n/gen/app_localizations.dart`. English is the
# template and ultimate fallback; zh (Traditional Chinese, the Taiwan market)
# is the base Chinese. Add a locale by dropping app_<locale>.arb into lib/l10n
# (e.g. app_zh_Hans.arb for Simplified, app_ja.arb for Japanese).
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-dir: lib/l10n/gen
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
