name: dpip
description: "Disaster Prevention Information Platform"
publish_to: 'none'
version: 3.9.9+1

environment:
  sdk: ^3.12.2

dependencies:
  awesome_notifications: ^0.12.1
  dio: ^5.10.0
  # Firebase pinned deliberately — a newer major bumps the min iOS target and
  # breaks older-device compatibility. Do not upgrade without checking that.
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.5
  flutter_ntp: ^0.1.0
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.3
  fl_chart: ^1.2.0
  go_router: ^17.3.0
  in_app_purchase: ^3.3.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  # ExpTech fork — HTTPS intercept + Dart tile-cache bridge.
  # Requires MapLibre Native 6.27.0 (ios/vendor/maplibre).
  # https://github.com/ExpTechTW/flutter-maplibre-gl
  # Pin a commit (not floating `main`) so CI/`pub get` can't rewrite
  # pubspec.lock. Local path override stays in gitignored
  # `pubspec_overrides.yaml` — after `pub get` with it, discard lock churn.
  maplibre_gl:
    git:
      url: https://github.com/ExpTechTW/flutter-maplibre-gl.git
      path: maplibre_gl
      ref: 2c515a3feaa7fee565e1ae03971aade841bec54f
  package_info_plus: ^10.2.0
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  talker_flutter: ^5.1.9
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.1.0
  json_serializable: ^6.14.0
  sqflite_common_ffi: ^2.4.2

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  generate: true
  shaders:
    - shaders/fog.frag
    - shaders/thunderstorm.frag
    - shaders/weather_sky.frag
  assets:
    - assets/DPIP.png
    - assets/box.json
    - assets/location.json.gz
    - assets/map/town_boundaries.bin.gz
    - assets/travel_time.json.gz
    - assets/map/icons/cross.png
    - assets/map/icons/intensity-1.png
    - assets/map/icons/intensity-1-dark.png
    - assets/map/icons/intensity-2.png
    - assets/map/icons/intensity-2-dark.png
    - assets/map/icons/intensity-3.png
    - assets/map/icons/intensity-3-dark.png
    - assets/map/icons/intensity-4.png
    - assets/map/icons/intensity-4-dark.png
    - assets/map/icons/intensity-5.png
    - assets/map/icons/intensity-5-dark.png
    - assets/map/icons/intensity-6.png
    - assets/map/icons/intensity-6-dark.png
    - assets/map/icons/intensity-7.png
    - assets/map/icons/intensity-7-dark.png
    - assets/map/icons/intensity-8.png
    - assets/map/icons/intensity-8-dark.png
    - assets/map/icons/intensity-9.png
    - assets/map/icons/intensity-9-dark.png
