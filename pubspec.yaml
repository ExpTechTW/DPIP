name: dpip
description: "Disaster Prevention Information Platform"
publish_to: 'none'
version: 3.2.1+1

environment:
  sdk: ^3.12.2

dependencies:
  awesome_notifications: ^0.12.1
  dio: ^5.10.0
  # Firebase pinned deliberately — a newer major bumps the min iOS target and
  # breaks older-device compatibility. Do not upgrade without checking that.
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_ntp: ^0.1.0
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.3
  go_router: ^17.3.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  maplibre_gl: ^0.25.0
  package_info_plus: ^10.2.0
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  talker_flutter: ^5.1.9
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.1.0
  json_serializable: ^6.14.0
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true
  generate: true
  shaders:
    - shaders/fog.frag
    - shaders/thunderstorm.frag
    - shaders/weather_sky.frag
  assets:
    - assets/DPIP.png
    - assets/location.json.gz
