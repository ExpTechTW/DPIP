name: Build iOS

# Pull requests, and the pushes to `main` that publish no snapshot. A push
# that does is handled by release.yml, which builds the signed, uploadable
# artifact — running this as well would spend a second runner producing an
# unsigned one nobody installs. One that does not would otherwise be built by
# nothing at all.
#
# Every pull request, not only the ones targeting `main`. A stacked branch
# opens its pull request against the layer below it, so `branches: [main]`
# silently excluded exactly the reviews that most needed a compiler: the ones
# where only the top of the stack is ever read against `main`. Four iOS-only
# commits reached review that way without Swift being built once.
on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per ref; a new push cancels the previous run. This matters
# more now that the trigger is every pull request: restacking a five-deep chain
# pushes five branches at once, and each one wants a macOS runner.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      release: ${{ steps.release.outputs.builds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes or fetches, so the job token is not left in
          # .git/config for the steps after this one.
          persist-credentials: false
          # A push reads its own commit messages below: full history, without
          # the file contents nothing here looks at.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
          filter: ${{ github.event_name == 'push' && 'blob:none' || '' }}
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ios:
              - 'ios/**'
              - 'assets/**'
              - 'lib/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'mise.toml'
              - 'tool/dev/_lib.sh'
              - 'tool/dev/build.sh'
              - 'tool/dev/codegen.sh'
              - 'tool/dev/deps.sh'
              - 'tool/dev/test_ios.sh'
              - 'tool/dev/test_widget_ui.sh'
              - 'tool/internal/apply_sdk_patches.sh'
              - 'tool/patches/**'
              - '.github/workflows/ios.yml'

      # Whether release.yml builds this push, for the job below. It publishes
      # a snapshot only when a commit since the last tag carries a changelog
      # entry; asked here of the push's own commits, which are always within
      # that range. So "yes" here is always "yes" there, and a push this
      # answers "no" for is built here — at worst by both, never by neither.
      - name: Does release.yml build this push
        id: release
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if bash tool/release/notes.sh --any "$BEFORE..$GITHUB_SHA"; then
            echo "builds=true" >> "$GITHUB_OUTPUT"
            echo "this push brings a changelog entry: release.yml builds it"
          else
            echo "builds=false" >> "$GITHUB_OUTPUT"
            echo "no changelog entry in this push: no snapshot, so it is built here"
          fi

  iOS:
    needs: changes
    if: ${{ needs.changes.outputs.ios == 'true' && needs.changes.outputs.release != 'true' }}
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      # Nothing here pushes, so the job token is not left in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Flutter and Dart come from mise.toml, the same pin CI and every laptop
      # use. Not subosito/flutter-action with `channel: stable`: that resolves
      # to whatever stable is on the day, so this job could ship an artifact
      # built against an SDK nobody chose, and nothing in the build log would
      # say so. See AGENTS.md → Toolchain.
      - name: Install toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      # The iOS build uses Swift Package Manager, not CocoaPods (there is no
      # Podfile). Cache SPM's clone/artifact store keyed on the resolved pins.
      - name: Cache Swift Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # build/ios/SourcePackages, not DerivedData. Flutter always passes
          # -clonedSourcePackagesDirPath pointing there (ios/xcodeproj.dart), so
          # DerivedData is never consulted for packages and caching it stored
          # nothing. Losing this directory is what makes a launch print fifteen
          # "Fetching from … (cached)" lines and cost 19-32 s.
          #
          # The DerivedData line is release.yml's, whose xcodebuild archive does
          # clone there; nothing in this job writes it. It is listed so the two
          # lists match line for line: a cache entry's version is a hash of these
          # paths, and only an identical list lets this job restore the entry
          # main saved instead of storing a fresh ~880 MB copy per pull request.
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/ios/SourcePackages
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install dependencies and run build_runner
        run: |
          bash tool/dev/deps.sh
          bash tool/dev/codegen.sh

      - name: Select and boot iPhone simulator
        id: simulator
        timeout-minutes: 5
        shell: bash
        run: |
          diagnostics="$RUNNER_TEMP/ios-test-diagnostics"
          mkdir -p "$diagnostics"
          # Keep the startup log even if Xcode cannot find or boot a device.
          {
            xcodebuild -version
            sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
            xcrun simctl list devices available
            # Prefer the runtime matching the selected Xcode's SDK, then the
            # newest installed runtime. Prefer the locally verified model on
            # that runtime when the image provides it.
            selected="$(xcrun simctl list --json | jq -er --arg sdk "$sdk" '
              . as $inventory
              | [ .runtimes[]
                  | select(.isAvailable and (.platform == "iOS"))
                  | . as $runtime
                  | $inventory.devices[$runtime.identifier][]?
                  | select(.isAvailable and ((.deviceTypeIdentifier // "") | startswith("com.apple.CoreSimulator.SimDeviceType.iPhone-")))
                  | { version: $runtime.version, name, udid, state }
                ]
              | sort_by([(.version == $sdk), (.version | split(".") | map(tonumber)),
                         (.name == "iPhone 17 Pro"), (.state == "Booted"), .name, .udid])
              | if length == 0 then error("No available iPhone simulator") else last end
              | [.udid, .name, .version] | @tsv
            ')"
            IFS=$'\t' read -r udid name version <<< "$selected"
            printf 'Selected %s / iOS %s / %s (iOS SDK %s)\n' "$name" "$version" "$udid" "$sdk"
            boot_log="$RUNNER_TEMP/ios-simulator-bootstatus.log"
            xcrun simctl bootstatus "$udid" -b 2>&1 | tee "$boot_log"
            # bootstatus can exit zero after reporting a failed data migration.
            if grep -Fq 'Data Migration Failed' "$boot_log"; then
              echo '::error::Simulator data migration failed during startup.'
              exit 1
            fi
            printf 'udid=%s\n' "$udid" >> "$GITHUB_OUTPUT"
          } 2>&1 | tee "$diagnostics/simulator-startup.log"

      # Runner builds DPIPWidgetsExtension and runs the hosted XCTest suite.
      # Disable parallel testing so Xcode uses the selected simulator itself
      # rather than launching clones for test workers.
      - name: Test (ios/RunnerTests)
        id: runner_tests
        timeout-minutes: 30
        shell: bash
        env:
          DPIP_IOS_SIMULATOR: ${{ steps.simulator.outputs.udid }}
        run: |
          diagnostics="$RUNNER_TEMP/ios-test-diagnostics"
          bash tool/dev/test_ios.sh \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/RunnerTests-DerivedData" \
            -resultBundlePath "$diagnostics/RunnerTests.xcresult" \
            2>&1 | tee "$diagnostics/RunnerTests.log" || {
              codes=("${PIPESTATUS[@]}")
              exit "$((codes[0] != 0 ? codes[0] : codes[1]))"
            }

      - name: Test (ios/WidgetFixtureUITests)
        id: widget_ui_tests
        # Run after RunnerTests even if it failed. The failed step remains a
        # job failure; only the prerequisite setup and cancellation gate this step.
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        timeout-minutes: 30
        shell: bash
        env:
          DPIP_IOS_SIMULATOR: ${{ steps.simulator.outputs.udid }}
        run: |
          diagnostics="$RUNNER_TEMP/ios-test-diagnostics"
          bash tool/dev/test_widget_ui.sh \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/WidgetFixtureUITests-DerivedData" \
            -clonedSourcePackagesDirPath build/ios/SourcePackages \
            -resultBundlePath "$diagnostics/WidgetFixtureUITests.xcresult" \
            2>&1 | tee "$diagnostics/WidgetFixtureUITests.log" || {
              codes=("${PIPESTATUS[@]}")
              exit "$((codes[0] != 0 ? codes[0] : codes[1]))"
            }

      - name: Summarize iOS tests
        if: ${{ !cancelled() && (steps.simulator.outcome == 'success' || steps.simulator.outcome == 'failure') }}
        shell: bash
        env:
          SIMULATOR_OUTCOME: ${{ steps.simulator.outcome }}
          RUNNER_TESTS_OUTCOME: ${{ steps.runner_tests.outcome }}
          WIDGET_UI_TESTS_OUTCOME: ${{ steps.widget_ui_tests.outcome }}
        run: |
          diagnostics="$RUNNER_TEMP/ios-test-diagnostics"
          {
            printf '### iOS test results\n\n- Simulator setup: %s\n' "$SIMULATOR_OUTCOME"
            for suite in RunnerTests WidgetFixtureUITests; do
              case "$suite" in
                RunnerTests) outcome="$RUNNER_TESTS_OUTCOME" ;;
                WidgetFixtureUITests) outcome="$WIDGET_UI_TESTS_OUTCOME" ;;
              esac
              printf -- '- %s: %s' "$suite" "$outcome"
              bundle="$diagnostics/$suite.xcresult"
              if [[ -d "$bundle" ]] && summary="$(xcrun xcresulttool get test-results summary --path "$bundle" | jq -er '
                select(.totalTestCount > 0)
                | " — \(.passedTests) passed, \(.failedTests) failed, \(.skippedTests) skipped"
              ')"; then
                printf '%s' "$summary"
              elif [[ "$outcome" == failure ]]; then
                if [[ -d "$bundle" ]] && xcrun xcresulttool get build-results --path "$bundle" |
                  jq -e '(.errorCount // (.errors | length)) > 0' >/dev/null; then
                  printf ' — build errors recorded in xcresult'
                else
                  printf ' — no test counts; check the log for build or test launch errors'
                fi
              fi
              printf '\n'
            done
          } | tee "$diagnostics/summary.md" >> "$GITHUB_STEP_SUMMARY"

          # The full bundle retains XCTest diagnostics and attachments. Export
          # any UI failure screenshots as well so they can be opened directly.
          ui_bundle="$diagnostics/WidgetFixtureUITests.xcresult"
          if [[ "$WIDGET_UI_TESTS_OUTCOME" == failure && -d "$ui_bundle" ]]; then
            xcrun xcresulttool export attachments --only-failures --filter '*.png' \
              --path "$ui_bundle" --output-path "$diagnostics/WidgetFixtureUITests-attachments" ||
              echo '::warning::Could not export UI test screenshots; see the xcresult bundle.'
          fi

      - name: Upload iOS test failure diagnostics
        if: ${{ !cancelled() && (steps.simulator.outcome == 'failure' || steps.runner_tests.outcome == 'failure' || steps.widget_ui_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DPIP-iOS-test-diagnostics
          path: ${{ runner.temp }}/ios-test-diagnostics/
          retention-days: 7

      - name: Build iOS App and create IPA
        run: |
          bash tool/dev/build.sh ios --debug
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qr DPIP.ipa Payload

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DPIP-iOS
          path: |
            build/ios/iphoneos/Runner.app
            DPIP.ipa
          retention-days: 7
          compression-level: 6
