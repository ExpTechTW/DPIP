name: Build iOS

# Pull requests, and the pushes to `main` that publish no snapshot. A push
# that does is handled by release.yml, which builds the signed, uploadable
# artifact — running this as well would spend a second runner producing an
# unsigned one nobody installs. One that does not would otherwise be built by
# nothing at all.
#
# Every pull request, not only the ones targeting `main`. A stacked branch
# opens its pull request against the layer below it, so `branches: [main]`
# silently excluded exactly the reviews that most needed a compiler: the ones
# where only the top of the stack is ever read against `main`. Four iOS-only
# commits reached review that way without Swift being built once.
on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per ref; a new push cancels the previous run. This matters
# more now that the trigger is every pull request: restacking a five-deep chain
# pushes five branches at once, and each one wants a macOS runner.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      runner_tests: ${{ steps.filter.outputs.runner_tests }}
      widget_ui_tests: ${{ steps.filter.outputs.widget_ui_tests }}
      release: ${{ steps.release.outputs.builds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes or fetches, so the job token is not left in
          # .git/config for the steps after this one.
          persist-credentials: false
          # A push reads its own commit messages below: full history, without
          # the file contents nothing here looks at.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
          filter: ${{ github.event_name == 'push' && 'blob:none' || '' }}
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ios:
              - 'ios/**'
              - 'assets/**'
              - 'lib/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'mise.toml'
              - 'tool/dev/_lib.sh'
              - 'tool/dev/build.sh'
              - 'tool/dev/codegen.sh'
              - 'tool/dev/deps.sh'
              - 'tool/dev/test_ios.sh'
              - 'tool/dev/test_widget_ui.sh'
              - 'tool/internal/apply_sdk_patches.sh'
              - 'tool/patches/**'
              - '.github/workflows/ios.yml'
            # ios/RunnerTests' filter, and deliberately narrower than `ios`.
            # The suite is Swift — the widget extension, the App Group snapshot
            # storage, the WidgetKit timeline. The host app starts the Dart side
            # while it runs, but no assertion reads it, so a lib/- or
            # assets/-only change spent ~11 minutes of a macOS runner
            # re-proving an unchanged tree. The IPA build still compiles every
            # Dart change on `ios`. What the suite does read outside ios/:
            #
            #   - pubspec.yaml and pubspec.lock. The Runner app the suite is
            #     hosted in links the plugins' Swift packages, and the two
            #     decide which plugins at which versions.
            #   - mise.toml, and tool/patches with the script that applies them:
            #     the pinned SDK's Flutter framework, which Runner links too.
            #   - The script itself, the _lib.sh it sources, and this file.
            runner_tests:
              - 'ios/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'mise.toml'
              - 'tool/dev/_lib.sh'
              - 'tool/dev/test_ios.sh'
              - 'tool/internal/apply_sdk_patches.sh'
              - 'tool/patches/**'
              - '.github/workflows/ios.yml'
            # ios/WidgetFixtureUITests' filter, narrower again. The WidgetFixture
            # app has no target dependency and links no package and no Flutter:
            # only Foundation. It compiles sources from ios/DPIPWidgets,
            # ios/Shared and ios/WidgetFixture, bundles resources from
            # ios/DPIPWidgets, and its UI tests are ios/WidgetFixtureUITests; the
            # targets, their build settings and the scheme are in
            # ios/Runner.xcodeproj. Nothing from ios/DPIPWidgetIntentsExtension,
            # ios/Runner or ios/RunnerTests is in it.
            #
            # Neither pub file is listed. The fixture links nothing from the
            # plugin package the project references; that package only has to
            # resolve, and `iOS build` resolves the same set on every change to
            # either. mise.toml is: this job sets up on that SDK, the SDK writes
            # that package, and a pin bump is rare enough to re-run this once.
            # Then the script, the _lib.sh it sources, and this file.
            widget_ui_tests:
              - 'ios/DPIPWidgets/**'
              - 'ios/Shared/**'
              - 'ios/WidgetFixture/**'
              - 'ios/WidgetFixtureUITests/**'
              - 'ios/Runner.xcodeproj/**'
              - 'mise.toml'
              - 'tool/dev/_lib.sh'
              - 'tool/dev/test_widget_ui.sh'
              - '.github/workflows/ios.yml'

      # Whether release.yml builds this push, for the job below. It publishes
      # a snapshot only when a commit since the last tag carries a changelog
      # entry; asked here of the push's own commits, which are always within
      # that range. So "yes" here is always "yes" there, and a push this
      # answers "no" for is built here — at worst by both, never by neither.
      - name: Does release.yml build this push
        id: release
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if bash tool/release/notes.sh --any "$BEFORE..$GITHUB_SHA"; then
            echo "builds=true" >> "$GITHUB_OUTPUT"
            echo "this push brings a changelog entry: release.yml builds it"
          else
            echo "builds=false" >> "$GITHUB_OUTPUT"
            echo "no changelog entry in this push: no snapshot, so it is built here"
          fi

  # Builds the app and runs ios/RunnerTests. Not the required check by itself:
  # the `iOS` job at the end of this file is, and it reads this job's result.
  # The build runs on `ios`; the simulator and the suite only on
  # `runner_tests`, and the job is green with those steps skipped.
  ios_build:
    name: iOS build
    needs: changes
    if: ${{ needs.changes.outputs.ios == 'true' && needs.changes.outputs.release != 'true' }}
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      # Nothing here pushes, so the job token is not left in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Flutter and Dart come from mise.toml, the same pin CI and every laptop
      # use. Not subosito/flutter-action with `channel: stable`: that resolves
      # to whatever stable is on the day, so this job could ship an artifact
      # built against an SDK nobody chose, and nothing in the build log would
      # say so. See AGENTS.md → Toolchain.
      - name: Install toolchain (mise)
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      # The iOS build uses Swift Package Manager, not CocoaPods (there is no
      # Podfile). Cache SPM's clone/artifact store keyed on the resolved pins.
      - name: Cache Swift Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # build/ios/SourcePackages, not DerivedData. Flutter always passes
          # -clonedSourcePackagesDirPath pointing there (ios/xcodeproj.dart), so
          # DerivedData is never consulted for packages and caching it stored
          # nothing. Losing this directory is what makes a launch print fifteen
          # "Fetching from … (cached)" lines and cost 19-32 s.
          #
          # The DerivedData line is release.yml's, whose xcodebuild archive does
          # clone there; nothing in this job writes it. It is listed so the two
          # lists match line for line: a cache entry's version is a hash of these
          # paths, and only an identical list lets this job restore the entry
          # main saved instead of storing a fresh ~880 MB copy per pull request.
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/ios/SourcePackages
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install dependencies and run build_runner
        run: |
          bash tool/dev/deps.sh
          bash tool/dev/codegen.sh

      - name: Select and boot iPhone simulator
        id: simulator
        if: needs.changes.outputs.runner_tests == 'true'
        timeout-minutes: 5
        shell: bash
        run: |
          diagnostics="$RUNNER_TEMP/ios-test-diagnostics"
          mkdir -p "$diagnostics"
          # Keep the startup log even if Xcode cannot find or boot a device.
          {
            xcodebuild -version
            sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
            xcrun simctl list devices available
            # Prefer the runtime matching the selected Xcode's SDK, then the
            # newest installed runtime. Prefer the locally verified model on
            # that runtime when the image provides it.
            selected="$(xcrun simctl list --json | jq -er --arg sdk "$sdk" '
              . as $inventory
              | [ .runtimes[]
                  | select(.isAvailable and (.platform == "iOS"))
                  | . as $runtime
                  | $inventory.devices[$runtime.identifier][]?
                  | select(.isAvailable and ((.deviceTypeIdentifier // "") | startswith("com.apple.CoreSimulator.SimDeviceType.iPhone-")))
                  | { version: $runtime.version, name, udid, state }
                ]
              | sort_by([(.version == $sdk), (.version | split(".") | map(tonumber)),
                         (.name == "iPhone 17 Pro"), (.state == "Booted"), .name, .udid])
              | if length == 0 then error("No available iPhone simulator") else last end
              | [.udid, .name, .version] | @tsv
            ')"
            IFS=$'\t' read -r udid name version <<< "$selected"
            printf 'Selected %s / iOS %s / %s (iOS SDK %s)\n' "$name" "$version" "$udid" "$sdk"
            boot_log="$RUNNER_TEMP/ios-simulator-bootstatus.log"
            xcrun simctl bootstatus "$udid" -b 2>&1 | tee "$boot_log"
            # bootstatus can exit zero after reporting a failed data migration.
            if grep -Fq 'Data Migration Failed' "$boot_log"; then
              echo '::error::Simulator data migration failed during startup.'
              exit 1
            fi
            printf 'udid=%s\n' "$udid" >> "$GITHUB_OUTPUT"
          } 2>&1 | tee "$diagnostics/simulator-startup.log"

      # Runner builds DPIPWidgetsExtension and runs the hosted XCTest suite.
      # Disable parallel testing so Xcode uses the selected simulator itself
      # rather than launching clones for test workers.
      - name: Test (ios/RunnerTests)
        id: runner_tests
        if: needs.changes.outputs.runner_tests == 'true'
        timeout-minutes: 30
        shell: bash
        env:
          DPIP_IOS_SIMULATOR: ${{ steps.simulator.outputs.udid }}
        run: |
          diagnostics="$RUNNER_TEMP/ios-test-diagnostics"
          bash tool/dev/test_ios.sh \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/RunnerTests-DerivedData" \
            -resultBundlePath "$diagnostics/RunnerTests.xcresult" \
            2>&1 | tee "$diagnostics/RunnerTests.log" || {
              codes=("${PIPESTATUS[@]}")
              exit "$((codes[0] != 0 ? codes[0] : codes[1]))"
            }

      # Summarize RunnerTests.
      - name: Summarize RunnerTests
        if: ${{ !cancelled() && (steps.simulator.outcome == 'success' || steps.simulator.outcome == 'failure') }}
        shell: bash
        env:
          SIMULATOR_OUTCOME: ${{ steps.simulator.outcome }}
          TEST_OUTCOME: ${{ steps.runner_tests.outcome }}
        run: |
          diagnostics="$RUNNER_TEMP/ios-test-diagnostics"
          bundle="$diagnostics/RunnerTests.xcresult"

          {
            printf '### RunnerTests\n\n'
            printf -- '- Simulator setup: %s\n' "$SIMULATOR_OUTCOME"
            printf -- '- Test result: %s' "$TEST_OUTCOME"

            if [[ -d "$bundle" ]] && summary="$(xcrun xcresulttool get test-results summary --path "$bundle" | jq -er '
              select(.totalTestCount > 0)
              | " — \(.passedTests) passed, \(.failedTests) failed, \(.skippedTests) skipped"
            ')"; then
              printf '%s' "$summary"
            fi

            printf '\n'
          } | tee "$diagnostics/summary.md" >> "$GITHUB_STEP_SUMMARY"

      # Upload diagnostics if RunnerTests failed.
      - name: Upload RunnerTests diagnostics
        if: ${{ !cancelled() && (steps.simulator.outcome == 'failure' || steps.runner_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DPIP-iOS-RunnerTests-diagnostics
          path: ${{ runner.temp }}/ios-test-diagnostics/
          retention-days: 7

      - name: Build iOS App and create IPA
        run: |
          bash tool/dev/build.sh ios --debug
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qr DPIP.ipa Payload

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DPIP-iOS
          path: |
            build/ios/iphoneos/Runner.app
            DPIP.ipa
          retention-days: 7
          compression-level: 6

  # ios/WidgetFixtureUITests, on a runner of its own so the suite runs beside
  # the build above instead of after it. Its result reaches the required `iOS`
  # check through the job below. Gated on `widget_ui_tests`, every path of
  # which is also on `ios`.
  ios_widget_ui_tests:
    name: iOS widget UI tests
    needs: changes
    if: ${{ needs.changes.outputs.widget_ui_tests == 'true' && needs.changes.outputs.release != 'true' }}
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain (mise)
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: Cache Swift Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The same list as the build job's above and release.yml's, line for
          # line, and it has to stay that way. A cache entry's version is a
          # hash of these paths, so a different list is a different cache under
          # the same key: this job would miss the entry main saved and store a
          # fresh ~880 MB copy per pull request. The DerivedData line is
          # release.yml's; nothing in this job writes it.
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/ios/SourcePackages
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install dependencies and run build_runner
        run: |
          bash tool/dev/deps.sh
          bash tool/dev/codegen.sh

      - name: Select and boot iPhone simulator
        id: simulator
        timeout-minutes: 5
        shell: bash
        run: |
          diagnostics="$RUNNER_TEMP/ios-test-diagnostics"
          mkdir -p "$diagnostics"

          {
            xcodebuild -version
            sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
            xcrun simctl list devices available

            selected="$(xcrun simctl list --json | jq -er --arg sdk "$sdk" '
              . as $inventory
              | [ .runtimes[]
                  | select(.isAvailable and (.platform == "iOS"))
                  | . as $runtime
                  | $inventory.devices[$runtime.identifier][]?
                  | select(.isAvailable and ((.deviceTypeIdentifier // "") | startswith("com.apple.CoreSimulator.SimDeviceType.iPhone-")))
                  | { version: $runtime.version, name, udid, state }
                ]
              | sort_by([(.version == $sdk), (.version | split(".") | map(tonumber)),
                         (.name == "iPhone 17 Pro"), (.state == "Booted"), .name, .udid])
              | if length == 0 then error("No available iPhone simulator") else last end
              | [.udid, .name, .version] | @tsv
            ')"

            IFS=$'\t' read -r udid name version <<< "$selected"
            printf 'Selected %s / iOS %s / %s (iOS SDK %s)\n' "$name" "$version" "$udid" "$sdk"

            boot_log="$RUNNER_TEMP/ios-simulator-bootstatus.log"
            xcrun simctl bootstatus "$udid" -b 2>&1 | tee "$boot_log"

            if grep -Fq 'Data Migration Failed' "$boot_log"; then
              echo '::error::Simulator data migration failed during startup.'
              exit 1
            fi

            printf 'udid=%s\n' "$udid" >> "$GITHUB_OUTPUT"
          } 2>&1 | tee "$diagnostics/simulator-startup.log"

      - name: Test (ios/WidgetFixtureUITests)
        id: widget_ui_tests
        timeout-minutes: 30
        shell: bash
        env:
          DPIP_IOS_SIMULATOR: ${{ steps.simulator.outputs.udid }}
        run: |
          diagnostics="$RUNNER_TEMP/ios-test-diagnostics"

          bash tool/dev/test_widget_ui.sh \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/WidgetFixtureUITests-DerivedData" \
            -clonedSourcePackagesDirPath build/ios/SourcePackages \
            -resultBundlePath "$diagnostics/WidgetFixtureUITests.xcresult" \
            2>&1 | tee "$diagnostics/WidgetFixtureUITests.log" || {
              codes=("${PIPESTATUS[@]}")
              exit "$((codes[0] != 0 ? codes[0] : codes[1]))"
            }

      - name: Summarize WidgetFixtureUITests
        if: ${{ !cancelled() && (steps.simulator.outcome == 'success' || steps.simulator.outcome == 'failure') }}
        shell: bash
        env:
          SIMULATOR_OUTCOME: ${{ steps.simulator.outcome }}
          TEST_OUTCOME: ${{ steps.widget_ui_tests.outcome }}
        run: |
          diagnostics="$RUNNER_TEMP/ios-test-diagnostics"
          bundle="$diagnostics/WidgetFixtureUITests.xcresult"

          {
            printf '### WidgetFixtureUITests\n\n'
            printf -- '- Simulator setup: %s\n' "$SIMULATOR_OUTCOME"
            printf -- '- Test result: %s' "$TEST_OUTCOME"

            if [[ -d "$bundle" ]] && summary="$(xcrun xcresulttool get test-results summary --path "$bundle" | jq -er '
              select(.totalTestCount > 0)
              | " — \(.passedTests) passed, \(.failedTests) failed, \(.skippedTests) skipped"
            ')"; then
              printf '%s' "$summary"
            fi

            printf '\n'
          } | tee "$diagnostics/summary.md" >> "$GITHUB_STEP_SUMMARY"

          # Export screenshots from failed UI tests.
          if [[ "$TEST_OUTCOME" == failure && -d "$bundle" ]]; then
            xcrun xcresulttool export attachments --only-failures --filter '*.png' \
              --path "$bundle" \
              --output-path "$diagnostics/WidgetFixtureUITests-attachments" ||
              echo '::warning::Could not export UI test screenshots; see the xcresult bundle.'
          fi

      - name: Upload WidgetFixtureUITests diagnostics
        if: ${{ !cancelled() && (steps.simulator.outcome == 'failure' || steps.widget_ui_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DPIP-iOS-WidgetFixtureUITests-diagnostics
          path: ${{ runner.temp }}/ios-test-diagnostics/
          retention-days: 7

  # The required check. The `main` ruleset requires a check named `iOS`, and
  # this job is what reports it: the two macOS jobs above run side by side and
  # meet here. Renaming `name:` below drops the check from every pull request,
  # and each one then waits for an `iOS` that never reports.
  #
  # It fails when any job it needs failed or was cancelled, `changes`
  # included, and passes when each one passed or was skipped. Skipped is how a
  # pull request that touches no iOS path, one that touches none of the widget
  # fixture's, and a push release.yml builds instead, all end green. A
  # RunnerTests step skipped inside `iOS build` leaves that job a success.
  #
  # `always()`, not the default: a failed job above would otherwise skip this
  # one, and a skipped required check counts as passing. Not `!cancelled()`
  # either, which skips this job in a cancelled run. With `always()`, a run
  # that a newer push cancels still reports `iOS`, as failed, on the commit
  # that push replaced, and the newer run reports it for the new head. The
  # check is never missing, and never green for work that did not finish.
  iOS:
    name: iOS
    needs: [changes, ios_build, ios_widget_ui_tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5

    steps:
      - name: Both iOS jobs passed or were skipped
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.ios_build.result }}
          WIDGET_UI_TESTS: ${{ needs.ios_widget_ui_tests.result }}
        run: |
          gate=pass
          report() {
            printf -- '- %s: %s\n' "$1" "$2" | tee -a "$GITHUB_STEP_SUMMARY"
            case "$2" in
              success | skipped) ;;
              *)
                echo "::error::$1 finished as $2"
                gate=fail
                ;;
            esac
          }

          printf '### iOS\n\n' >> "$GITHUB_STEP_SUMMARY"
          report changes "$CHANGES"
          report 'iOS build' "$BUILD"
          report 'iOS widget UI tests' "$WIDGET_UI_TESTS"
          [[ "$gate" == pass ]]
