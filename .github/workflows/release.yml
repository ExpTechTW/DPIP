# Every commit on main is a snapshot; every tag is a release.
#
# The three values a build carries come from `tool/release/version.sh` and nowhere
# else — no human edits a version, and `pubspec.yaml`'s stays a placeholder for
# local runs. See that script for why the label, the train and the ordinal are
# three separate things.
name: Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

# One release at a time. Two concurrent runs would publish two builds whose
# ordinals were computed from different commits, and the loser would be the
# newer one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.v.outputs.label }}
      train: ${{ steps.v.outputs.train }}
      code: ${{ steps.v.outputs.code }}
      date: ${{ steps.v.outputs.date }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      # Full history: the label counts this week's commits and the train reads
      # the newest tag. A shallow clone has neither.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: v
        run: |
          eval "$(tool/release/version.sh)"
          echo "label=$DPIP_LABEL" >> "$GITHUB_OUTPUT"
          echo "train=$DPIP_TRAIN" >> "$GITHUB_OUTPUT"
          echo "code=$DPIP_CODE" >> "$GITHUB_OUTPUT"
          echo "date=$DPIP_DATE" >> "$GITHUB_OUTPUT"
          # A tag is a release; anything else is a snapshot.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "::notice::$DPIP_LABEL — $DPIP_TRAIN ($DPIP_CODE, built $DPIP_DATE)"

      # The ordinal is the one value that must never repeat or go backwards: a
      # store that has accepted a code refuses every build at or below it,
      # permanently, and deleting the build does not release the number.
      # Checking here fails the run loudly instead of failing an upload later,
      # when the artifacts have already been built.
      #
      # This only sees what *this* workflow published. A build uploaded by hand
      # is invisible to it — which is how 408283049 reached TestFlight ahead of
      # the scheme. The per-store floors in tool/release/version.sh are what cover
      # those; raise one whenever something is shipped outside this workflow.
      - name: Ordinal must be higher than the last published one
        env:
          GH_TOKEN: ${{ github.token }}
          # Through the environment rather than interpolated into the script:
          # the value is ours, but a shell comparison built by string
          # substitution is the shape that goes wrong when the value is not.
          CODE: ${{ steps.v.outputs.code }}
        run: |
          # The REST endpoint rather than `gh release list`: that command has no
          # `body` field at all (it is only on `gh release view`), so the whole
          # check errored out before it could compare anything. One request
          # returns bodies for every release, newest first.
          #
          # `.body // ""` because a release created without notes has a null
          # body, and jq's `capture` refuses to match against null — one such
          # release anywhere in the list used to abort the run.
          previous="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | (.body // "") | capture("<!--\\s*dpip-build:\\s*(?<c>\\d+)") | .c | tonumber] | max // 0')"
          echo "previous=$previous current=$CODE"
          if [ "$CODE" -le "$previous" ]; then
            echo "::error::build ordinal $CODE is not above the published $previous"
            exit 1
          fi

  build:
    needs: version
    strategy:
      # Independent: one store failing must not stop the other shipping.
      fail-fast: false
      matrix:
        include:
          - platform: android
            runs-on: ubuntu-latest
          - platform: ios
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      # Full history: tool/release/build_info.sh counts commits and reads tags.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Flutter/Dart come from mise.toml, the same pin ci.yml and every
      # developer use. A published build is the one that most needs to be
      # reproducible, so it must not be the one tracking whatever "stable"
      # happens to mean on the day it runs.
      - uses: jdx/mise-action@v4

      - if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "gradle"

      # Keyed on the lockfile, so it is reused until a dependency actually
      # moves. Without it every release re-downloads the full package set —
      # mise caches the SDK but knows nothing about pub.
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      # The iOS build resolves its dependencies through Swift Package Manager
      # (there is no Podfile). Uncached, every release re-clones and rebuilds
      # every package before the app's own code is even compiled — on the
      # runner that bills at ten times the Linux rate.
      - name: Cache Swift packages
        if: matrix.platform == 'ios'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # The committed copy is a stub; the real values come from git. CI also
      # passes them with --dart-define below, so this is belt and braces — but
      # it is what makes the file compile at all.
      - run: bash tool/release/build_info.sh

      - run: bash tool/dev/deps.sh

      # Without these the release build silently falls back to the *debug*
      # signing config (see `buildTypes.release` in android/app/build.gradle.kts),
      # which is signed with the well-known keypair that ships in the Android
      # SDK. Play refuses such a bundle outright, and a sideloaded APK signed
      # with it can be "updated" by anyone — on a disaster app that is not a
      # theoretical objection. The quoted heredoc keeps a `$` in a password from
      # being eaten by the shell.
      - name: Install the upload key
        if: matrix.platform == 'android'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/my-release-key.jks
          cat > android/key.properties << 'EOF'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=my-release-key.jks
          EOF

      # xcodebuild takes a *path* to the key, not the key. `printf` rather than
      # `echo` so nothing is appended to the PEM.
      - name: Install the App Store Connect API key
        if: matrix.platform == 'ios'
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "${{ secrets.APPSTORE_API_PRIVATE_KEY }}" \
            > "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8"

      # Without this the archive below creates a brand-new Apple Development
      # certificate, every run. The runner's keychain is empty, the archive
      # signs for development, Apple's cloud signing covers distribution only,
      # and `-allowProvisioningUpdates` creates whatever it cannot find. Each
      # one is dead on arrival — its private key never leaves the runner — and
      # they pile up in the account until the team hits Apple's cap, at which
      # point every iOS release fails at once until a human revokes by hand.
      #
      # tool/release/ios_keychain.sh has the full mechanism, including why
      # dropping the flag is not the fix and why the certificate cannot simply
      # be downloaded.
      #
      # No teardown step. The keychain lives under $RUNNER_TEMP on a VM GitHub
      # destroys, which is the same reason `Remove the API key` further down is
      # about the repository checkout rather than the machine.
      - name: Install the iOS signing identity
        if: matrix.platform == 'ios'
        env:
          # Through the environment rather than `${{ }}` inside the script
          # body: a secret spliced into a shell by string substitution is one
          # quote away from being read as shell.
          APPLE_DEV_CERT_BASE64: ${{ secrets.APPLE_DEV_CERT_BASE64 }}
          APPLE_DEV_CERT_PASSWORD: ${{ secrets.APPLE_DEV_CERT_PASSWORD }}
        run: bash tool/release/ios_keychain.sh

      # `--build-name` is what reaches `CFBundleShortVersionString`, so it is
      # the *train*: Apple rejects anything that is not one to three integers
      # (ERROR ITMS-90060), at upload, TestFlight included. Android takes its
      # `versionName` from `DPIP_LABEL` instead — see android/app/build.gradle.kts
      # — so the store page shows the name a human was given.
      #
      # `DPIP_LABEL` also rides in as a dart-define, which is what the app
      # itself displays on every platform.
      #
      # Android builds twice on purpose: the APK is what a person sideloads from
      # the GitHub release, the AAB is the only thing Play accepts.
      - name: Build
        env:
          # Only the label: gradle takes its versionCode from Flutter's
          # `--build-number` above, so there is one source for it rather than
          # two that can disagree.
          DPIP_LABEL: ${{ needs.version.outputs.label }}
        run: |
          # One number for both stores — see tool/release/version.sh for why they can
          # be aligned. It is also what the release advertises and what the
          # update check compares, so nothing anywhere has to translate.
          COMMON="--build-name=${{ needs.version.outputs.train }} \
                  --build-number=${{ needs.version.outputs.code }} \
                  --dart-define=DPIP_LABEL=${{ needs.version.outputs.label }} \
                  --dart-define=DPIP_CODE=${{ needs.version.outputs.code }} \
                  --dart-define=DPIP_TRAIN=${{ needs.version.outputs.train }} \
                  --dart-define=DPIP_DATE=${{ needs.version.outputs.date }}"
          if [ "${{ matrix.platform }}" = "android" ]; then
            bash tool/dev/build.sh android $COMMON
            bash tool/dev/build.sh bundle $COMMON
            mv build/app/outputs/flutter-apk/app-release.apk \
               "DPIP-${{ needs.version.outputs.label }}.apk"
          else
            # Two steps rather than `flutter build ipa`. Flutter passes
            # `-allowProvisioningUpdates` but never the App Store Connect
            # authentication flags, so on a runner with no signed-in Xcode
            # account automatic signing has nothing to authenticate as. Driving
            # xcodebuild directly is the only way to hand it the API key.
            #
            # The Flutter step still has to run first: it writes
            # FLUTTER_BUILD_NUMBER into ios/Flutter/Generated.xcconfig, which is
            # where Info.plist's CFBundleVersion comes from.
            bash tool/dev/build.sh ios $COMMON
            AUTH=(-allowProvisioningUpdates
                  -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8"
                  -authenticationKeyID "${{ secrets.APPSTORE_API_KEY_ID }}"
                  -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}")
            ( cd ios && xcodebuild -workspace Runner.xcworkspace -scheme Runner \
                -configuration Release -sdk iphoneos \
                -archivePath "$RUNNER_TEMP/Runner.xcarchive" "${AUTH[@]}" archive )
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
              -exportOptionsPlist ios/ExportOptions.plist \
              -exportPath "$RUNNER_TEMP/ipa" "${AUTH[@]}"
            ipa="$(find "$RUNNER_TEMP/ipa" -maxdepth 1 -name '*.ipa' | head -1)"
            if [ -z "$ipa" ]; then
              echo "::error::export produced no .ipa"; ls -R "$RUNNER_TEMP/ipa" || true; exit 1
            fi
            mv "$ipa" "DPIP-${{ needs.version.outputs.label }}.ipa"
          fi

      # Resolved at run time, not hardcoded: the directory carries the AGP task
      # name (`.../release/mergeReleaseNativeLibs/out/lib`), which is an
      # implementation detail that has been renamed between AGP versions. An
      # empty output makes the upload skip symbols rather than fail the release
      # — losing symbolication is recoverable, losing the build is not.
      - name: Locate native debug symbols
        id: symbols
        if: matrix.platform == 'android'
        run: |
          dir="$(find build/app/intermediates/merged_native_libs/release \
                   -type d -name lib -path '*/out/*' 2>/dev/null | head -1)"
          [ -n "$dir" ] || echo "::warning::no native symbol directory found; uploading without symbols"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # A tag goes to production; everything else to internal testing.
      #
      # This is the only place the two differ on the store side. Play has real
      # tracks, so "release" and "snapshot" are different destinations — unlike
      # iOS, where there is one upload and only what happens *after* it differs
      # (see the TestFlight step below).
      #
      # `status: completed` means the release rolls out to 100% once Google's
      # review clears. A first automated production push may want `draft`
      # instead — that lands it in the console for a human to roll out — or a
      # staged `inProgress` with `userFraction`. Full rollout is what a tag
      # means here, so that is what it does.
      - name: Upload to Play
        if: matrix.platform == 'android'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.exptech.dpip
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          # `track` is deprecated in favour of the plural, which takes a list.
          tracks: ${{ github.ref_type == 'tag' && 'production' || 'internal' }}
          status: completed
          releaseName: ${{ needs.version.outputs.label }}
          # Lets Play symbolicate native crashes (MapLibre, the mesh stack)
          # instead of showing raw addresses.
          debugSymbols: ${{ steps.symbols.outputs.dir }}

      # There is one iOS destination and this is it, for a snapshot and a
      # release alike: App Store Connect. A build lands there, TestFlight is
      # simply the view of builds that have landed, and the *same* build is
      # what an App Store version is later built from — there is no separate
      # "upload to the App Store".
      #
      # So a tag changes nothing here. What it would change is everything
      # *after*: creating an `appStoreVersion`, attaching this build to it and
      # submitting it for review. That is deliberately not automated — the
      # first submission needs screenshots, review notes and export-compliance
      # answers, and automating a step nobody has yet performed by hand is how
      # a release gets stuck in a state no one recognises.
      - name: Upload to App Store Connect
        if: matrix.platform == 'ios'
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: DPIP-${{ needs.version.outputs.label }}.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          # The upload finishes; the wait after it cannot. The action signs one
          # App Store Connect JWT with a 600-second life (`n=600` in its bundled
          # dist/index.js) and never re-signs it, while its own poll schedule
          # sleeps 60 + 120 + 240 + 300 = 720 seconds before giving up. Any build
          # that takes longer than the token lives reports
          # `401 NOT_AUTHORIZED` — after the binary is already on TestFlight.
          #
          # Nothing here needs the wait: it exists so the action can write
          # metadata afterwards, and this step sets neither `release-notes` nor
          # `uses-non-exempt-encryption` — Info.plist already declares
          # ITSAppUsesNonExemptEncryption. What is given up is being told when
          # Apple rejects a binary during processing, which this step never told
          # us anyway: it failed on the token whether processing passed or not.
          wait-for-processing: 'false'

      # An Admin credential for the whole App Store Connect account. The runner
      # is ephemeral, but removing it costs one line.
      - name: Remove the API key
        if: always() && matrix.platform == 'ios'
        run: rm -rf "$RUNNER_TEMP/private_keys"

      - uses: actions/upload-artifact@v4
        with:
          name: dpip-${{ matrix.platform }}
          path: DPIP-*.*
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The ordinal rides in the body as an HTML comment: GitHub renders it as
      # nothing, so the note stays a note while the app still has something
      # unambiguous to compare. See `buildCodeOf` in update_check.dart.
      # Built from the commit messages themselves — see tool/release/notes.sh
      # for why a release accumulates across the snapshots it followed while a
      # snapshot is only a delta.
      - name: Release notes
        env:
          # Actions does not put GITHUB_TOKEN in the environment; a step has to
          # ask. Without it notes.sh resolves authors unauthenticated, at 60
          # requests an hour shared across everything on that runner's IP — and
          # a rate-limited release produced a note that credited nobody and said
          # nothing about why.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            bash tool/release/notes.sh \
              "${{ needs.version.outputs.label }}" \
              "${{ needs.version.outputs.code }}" --release > NOTES.md
          else
            bash tool/release/notes.sh \
              "${{ needs.version.outputs.label }}" \
              "${{ needs.version.outputs.code }}" > NOTES.md
          fi
          cat NOTES.md

      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            # The bare label. `v[0-9]*` is what makes a build a release, so a
            # snapshot named `26w33a` is already in its own namespace — and it
            # is the name tool/release/version.sh counts to work out the next letter.
            # An earlier `snapshot/` prefix put the tags somewhere the counter
            # did not look, so every run computed `a` and this step died on a
            # tag that already existed.
            tag="${{ needs.version.outputs.label }}"
            git tag "$tag"
            git push origin "$tag"
          fi
          gh release create "$tag" \
            --title "${{ needs.version.outputs.label }}" \
            --notes-file NOTES.md \
            --prerelease="${{ needs.version.outputs.prerelease }}" \
            artifacts/*
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Here rather than in a workflow of its own listening on `release`.
      # GitHub refuses to start a workflow run from an event its own
      # GITHUB_TOKEN caused, and the release above is created with exactly that
      # token — an `on: release: [published]` workflow would sit silent forever
      # and look like a Discord problem.
      #
      # `published` would also have been the only safe type to listen for:
      # publishing a pre-release fires `published` *and* `prereleased`, so
      # asking for both announces every snapshot twice.
      - name: Announce on Discord
        if: always() && steps.publish.outputs.tag != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # Not secrets: a custom emoji's id is visible to everyone who can see
          # the server, and it is useless without the webhook that is. Here
          # rather than as defaults in the script, so a fork announcing to its
          # own server falls back to the unicode pair instead of referencing
          # emoji it does not have.
          DPIP_EMOJI_ANDROID: "<:android:1539201870935892028>"
          DPIP_EMOJI_IOS: "<:ios:1539201897766981692>"
          # Without it the release lookup runs unauthenticated, at 60 requests
          # an hour shared across everything on this runner's IP.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "::notice::DISCORD_WEBHOOK is not set — nothing announced"
            exit 0
          fi
          # A warning, not a failure. The build is published and the artifacts
          # are downloadable by the time this runs; turning the job red over an
          # announcement would say the release did not happen.
          python3 tool/release/discord.py "${{ steps.publish.outputs.tag }}" ||
            echo "::warning::Discord announcement failed — the release itself is fine"
