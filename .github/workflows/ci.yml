name: CI

# Foundation gates for the rewrite branch: the checks below must stay green so
# the architecture, codegen, and safety-critical EEW math can't silently rot.
on:
  push:
    branches: [rewrite, main]
  pull_request:

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history: the commit gate walks the range this push or PR adds, and
      # a shallow clone has no base to compare against.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The commit gate first, because it is the only failure that cannot be
      # fixed by another commit. A message is immutable once pushed, so the
      # repair is a rebase and a force-push — and the later that is discovered,
      # the more there is to rebase.
      - name: Commit message gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}..HEAD"
            git fetch --quiet origin "${{ github.base_ref }}"
          else
            # A push event names what it replaced. On the first push to a new
            # branch the before-sha is all zeroes, so fall back to the last
            # commit alone.
            before="${{ github.event.before }}"
            case "$before" in
            ''|0000000000000000000000000000000000000000) range="HEAD~1..HEAD" ;;
            *) range="$before..HEAD" ;;
            esac
          fi
          echo "checking $range"
          bash tool/check_commits.sh "$range"

      # The commits on the branch are not what lands on main. This repo
      # squash-merges, so GitHub builds the merged commit out of the PR's title
      # and description — which this gate never saw. That is not hypothetical:
      # `332fb8f3 Fix report (#529)` is on main, passes nothing, and can never
      # be repaired. Check the message that will actually be committed.
      - name: Commit message gate (squashed PR title)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Via the environment, never through expression interpolation: a PR
          # title is attacker-controlled text, and interpolating it would paste
          # it straight into this shell.
          #
          # This comment may not name the syntax it is warning about. A `run`
          # block is interpolated whole before bash ever sees it, so a literal
          # empty expression here is a *workflow* syntax error — the run is
          # refused before any job is created, which is reported as a failure
          # with no failing step and the file path where the name should be.
          # That is what took CI down; `#` is a shell comment, not a shield.
          {
            printf '%s\n\n' "$PR_TITLE"
            printf '%s\n' "$PR_BODY"
          } > /tmp/pr_message.txt
          bash tool/check_commits.sh --message /tmp/pr_message.txt

      # The workflows themselves, because a broken one does not fail — it is
      # *refused*. GitHub interpolates a `run` block whole before bash sees it,
      # so an expression error anywhere in it, comment included, kills the run
      # before a job exists: no failing step, and the file path where the name
      # should be. Nothing in this repository could have caught that, and it
      # took CI down on main for a day.
      - name: Workflow gate
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) >/dev/null
          ./actionlint -shellcheck= .github/workflows/*.yml

      # Architecture gate — pure grep, no toolchain, fails fast.
      - name: Layering gate
        run: bash tool/check_layering.sh

      # Localization gate — bash + python3 (preinstalled), no toolchain either:
      # ARB parity + no hardcoded UI strings. See CLAUDE.md → Localization.
      - name: Localization gate
        run: bash tool/check_l10n.sh

      # Storage gate — settings via the typed SettingsStore; sqflite only in
      # the store that owns each table.
      - name: Storage gate
        run: bash tool/check_storage.sh

      # Every channel sound must resolve, or the channel is rejected on device.
      - name: Notification-sound gate
        run: bash tool/check_notification_sounds.sh

      # Lockfile must not embed a machine-local path (pubspec_overrides leak).
      - name: pubspec.lock path gate
        run: bash tool/check_pubspec_lock.sh

      # Flutter/Dart come from mise.toml, so CI uses the exact pinned version
      # developers run locally — one source of truth. v4 = Node 24 runtime
      # (Node 20 actions are forced onto 24 and emit deprecation warnings).
      - name: Install toolchain (mise)
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise exec -- flutter pub get

      - name: Format
        run: mise exec -- dart format --set-exit-if-changed lib test

      # Committed *.freezed.dart / *.g.dart must match a fresh build — a stale
      # generated file (e.g. after editing a model without regenerating) fails
      # here instead of shipping.
      # What git knows about this build. Committed as a stub — see the header
      # of the generated file — so CI has to write the real values itself.
      # Without this the checkout compiles whatever symbols the stub happens to
      # declare, and a new one added locally is invisible until a store build
      # fails: the file is `skip-worktree`, so a developer's own copy has the
      # symbol and their `flutter analyze` passes while CI's does not.
      - name: Build info
        run: bash tool/check_build_info.sh

      - name: Codegen is up to date
        run: |
          mise exec -- dart run build_runner build --delete-conflicting-outputs
          # build_info.g.dart is excluded because it *cannot* match: it holds
          # the hash of the commit it is committed in.
          git diff --exit-code -- . ':!lib/core/build_info.g.dart' || {
            echo "::error::Working tree dirty after build_runner (stale codegen, or pubspec.lock rewritten — e.g. a path override leaked into the lockfile). Run: dart run build_runner build && flutter pub get (without pubspec_overrides.yaml) and commit."
            git --no-pager diff --stat
            git --no-pager diff
            exit 1
          }

      - name: Analyze
        run: mise exec -- flutter analyze

      # The ETag-cache tests run SQLite on the host via sqflite_common_ffi;
      # ubuntu ships libsqlite3.so.0 but not the unversioned symlink its loader
      # needs, so install the dev package.
      - name: Install SQLite (sqflite_common_ffi host tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Test
        run: mise exec -- flutter test
