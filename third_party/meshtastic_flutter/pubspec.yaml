name: meshtastic_flutter
description: "A comprehensive Flutter package for communicating with Meshtastic devices over Bluetooth Low Energy (BLE)."
version: 0.0.3
homepage: https://github.com/M4dhav/meshtastic_flutter

environment:
  sdk: ^3.8.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  protobuf: ^4.2.0
  flutter_blue_plus: ^1.35.5
  permission_handler: ^12.0.1
  logging: ^1.3.0
  fixnum: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

